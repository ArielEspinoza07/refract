name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Pint, PHPStan, type and line coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Newest version, so line coverage includes code paths for PHP 8.4+ features.
          # PHPStan still checks against 8.3 through phpVersion in phpstan.neon.
          php-version: '8.5'
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: quality-php-8.5-${{ hashFiles('composer.json') }}
          restore-keys: quality-php-8.5-

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Type coverage
        run: composer test:types

      - name: Line coverage
        run: composer test:coverage

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: tests-php-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: tests-php-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  # A single check for branch protection to require, so changing the PHP versions in the
  # matrix above never renames a required check.
  tests-passed:
    name: Tests passed
    needs: tests
    # Run even when a test combination fails; otherwise this job is skipped, and a skipped
    # required check can count as passing.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every test combination passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test matrix result: $RESULT"
          test "$RESULT" = "success"